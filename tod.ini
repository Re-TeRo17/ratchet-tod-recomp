# tod.ini -- settings for Ratchet & Clank: Tools of Destruction Recompiled.
#
# Format: KEY = VALUE, one per line. '#' or ';' start a comment.
# The file is looked for next to tod.exe, then in the current folder.
# An environment variable with the same name wins over the file (handy for tests).
# A commented-out or empty line = the default. In game, F1 (keyboard) or holding
# SELECT for 2 seconds (controller) opens the settings page; "Apply and save"
# rewrites this file (comments kept). Some rows apply at once, others at the next start.

# ---- Language ---------------------------------------------------------------
# PS3_LANG: the console language the game sees (text, voices, subtitles). The
# installer asks for it and writes it here; it is also in F1 > System (applies at
# the next start). One of: english, english_gb, french, german, spanish, italian,
# dutch, portuguese, swedish, norwegian, danish, finnish, korean, chinese_t, japanese.
PS3_LANG = english

# ---- Frame rate -------------------------------------------------------------
# TOD_FPS: frame-rate target. A number (10..1000) = a cap; "lock60" = a hard lock.
# Above 60 VSync turns itself off and the physics uses a smaller step (see README).
# Default of the original game: its own pace (30 in many places).
TOD_FPS = 60

# ---- Video (Direct3D 12 renderer) ---------------------------------------------
# RSX_BACKEND: "vulkan" for the (experimental) Vulkan renderer; otherwise Direct3D 12.
# RSX_BACKEND = vulkan

# RSX_DISPLAY: windowed | borderless | fullscreen (exclusive). Default: windowed.
RSX_DISPLAY = borderless

# RSX_WINDOW: window size, <width>x<height> (320x240 .. 16384x16384). Windowed mode only.
# RSX_WINDOW = 1920x1080

# RSX_SCALE: internal rendering resolution as a multiple of the game's 1280x720.
#   1 = 720p, 1.5 = 1080p, 2 = 1440p, 3 = 4K. Range 0.5 .. 8.
# The window size does not change: a lower scale is only blurrier, a higher one costs GPU.
RSX_SCALE = 1.5

# RSX_VSYNC: 1 = sync to the monitor, 0 = no. Default 1.
# RSX_VSYNC = 1

# RSX_AA: anti-aliasing: off, fxaa, msaa2, msaa4, msaa8. MSAA x8 at 4K needs a strong GPU.
RSX_AA = msaa4

# RSX_ANISO: anisotropic filtering, 1..16. Default 16.
# RSX_ANISO = 16

# TOD_ASPECT: ultrawide screens (OPT-IN; off = 16:9, as on the PS3). Values: 16:9 | 21:9 | 32:9 | <w>:<h> (e.g. 43:18) |
# a ratio (2.39) | auto (the shape of RSX_WINDOW, or of the screen with borderless/fullscreen).
# The game widens the 3D view (same vertical field of view, you see more at the sides); the image, which the game renders at
# 1280x720 x RSX_SCALE and therefore squeezed, is stretched back to the chosen shape. Set RSX_WINDOW (or RSX_DISPLAY =
# borderless) to the same shape, e.g. TOD_ASPECT = 21:9 with RSX_WINDOW = 3440x1440. A window of another shape gets black
# bars (3440x1440 is 43:18, not 21:9: with 21:9 about 40 px of bar stay on each side; "auto" fills the window).
# The horizontal resolution is 1280 x RSX_SCALE: use RSX_SCALE 2-3.
# LIMITS: the HUD and the 2D menus are stretched with the image; movies stay 16:9 with bars. Read at start-up only.
# TOD_ASPECT = 21:9

# TOD_FPS_COUNTER: 0 = off, 1 = FPS, 2 = detailed (fps, frame time, 1% low of the last 5 s).
TOD_FPS_COUNTER = 0

# TOD_MOUSE (OPT-IN, for keyboard players): 1 = the mouse moves the camera and the aim (right stick) and has buttons:
# left = R1 (fire), right = L1 (strafe / lock-on), middle = Triangle (quick select), wheel = D-pad left/right, Esc = Start.
# The cursor is hidden and kept inside the window while the window has focus and the F1 page is closed; F1 or Alt+Tab
# release it (Shift+Esc or Alt+F4 quit the game). The maximum camera speed is the game's "Camera Speed" option: raise it
# in the game's Options. 0 = off (default).
# TOD_MOUSE = 0
# TOD_MOUSE_SENS: sensitivity (1 = default; 2 = twice as fast). TOD_MOUSE_INVERT_Y = 1 inverts the vertical axis.
# TOD_MOUSE_WHEEL = off takes the wheel off the D-pad.
# TOD_MOUSE_SENS = 1.0
# TOD_MOUSE_INVERT_Y = 0
# TOD_MOUSE, TOD_MOUSE_SENS and TOD_MOUSE_INVERT_Y can also be changed in F1 > Controls (they apply at once).
# Mouse buttons (with TOD_MOUSE = 1): which pad button each one presses. Values: Cross Circle Square Triangle
# L1 R1 L2 R2 L3 R3 Start Select DpadUp DpadDown DpadLeft DpadRight None. Defaults below.
# TOD_MOUSE_LEFT = R1
# TOD_MOUSE_RIGHT = L1
# TOD_MOUSE_MIDDLE = Triangle
# TOD_MOUSE_WHEEL_UP = DpadLeft
# TOD_MOUSE_WHEEL_DOWN = DpadRight

# ---- Keyboard: key bindings ---------------------------------------------------
# KEY_<input> = <key>: which key (or mouse button) is each PS3 pad input. Easiest from F1 > Controls (Enter or click
# a row, then press the new key; Esc cancels, Backspace clears): the change is written here and applies at once.
# The lines below are the defaults (the original layout): remove the '#' to change one. None = no key. One key can
# drive several inputs (the arrows move both the D-pad and the left stick). KEY_CAMERA_* = the right stick (camera)
# from the keyboard; the mouse camera, when on, wins while the mouse moves.
# Key names: A..Z, 0..9 (number row), F1..F24, Num0..Num9, NumPlus NumMinus NumMultiply NumDivide NumDecimal,
# Space Enter Tab Esc Backspace, Up Down Left Right, LShift RShift LCtrl RCtrl LAlt RAlt (Shift Ctrl Alt = either),
# Insert Delete Home End PageUp PageDown CapsLock Pause, Semicolon Equals Comma Minus Period Slash Backquote
# LeftBracket Backslash RightBracket Quote (US keyboard positions), MouseLeft MouseRight MouseMiddle Mouse4 Mouse5.
# F1 (settings page) and F8 are reserved; Shift+Esc and Alt+F4 always quit the game.
# The keyboard button icons in the game still show the default keys after a change.
# KEY_CROSS = Z
# KEY_CIRCLE = X
# KEY_SQUARE = A
# KEY_TRIANGLE = S
# KEY_L1 = Q
# KEY_R1 = W
# KEY_L2 = 1
# KEY_R2 = 2
# KEY_L3 = None
# KEY_R3 = None
# KEY_START = Enter
# KEY_SELECT = Tab
# KEY_DPAD_UP = Up
# KEY_DPAD_DOWN = Down
# KEY_DPAD_LEFT = Left
# KEY_DPAD_RIGHT = Right
# KEY_LSTICK_UP = Up
# KEY_LSTICK_DOWN = Down
# KEY_LSTICK_LEFT = Left
# KEY_LSTICK_RIGHT = Right
# KEY_CAMERA_UP = None
# KEY_CAMERA_DOWN = None
# KEY_CAMERA_LEFT = None
# KEY_CAMERA_RIGHT = None

# ---- DualSense (PS5 controller) -----------------------------------------------
# Without a DualSense connected these do nothing. Default: all on. Also in F1 > System (they apply at once).
# TOD_DS_TRIGGERS: adaptive triggers. The right trigger resists, clicks or vibrates like the weapon Ratchet is
# holding (free in menus, in pause, in cutscenes and when out of ammo). 1 = on (default), 0 = off.
# TOD_DS_TRIGGERS = 1
# TOD_DS_TRIGGER_STRENGTH: strength of the resistance and of the kick at each shot, 25..100 (%). Default 100.
# TOD_DS_TRIGGER_STRENGTH = 100
# TOD_DS_FIRE_R2: 1 = on a DualSense the right trigger (R2) fires and R1 does what R2 does on a PS3 pad, so the
# trigger with the motor is the one you fire with (the on-screen icons still say R1 for fire). 0 = the PS3 layout
# (R1 fires). Default 1.
# TOD_DS_FIRE_R2 = 1
# TOD_XB_TRIGGERS: Xbox One / Series controller: the right trigger's motor ("impulse triggers") kicks at
# every shot. 1 = on (default), 0 = off. Strength: TOD_DS_TRIGGER_STRENGTH. Also in F1 > System.
# TOD_XB_TRIGGERS = 1

# RT_AO: 1 = ray-traced ambient occlusion (needs a DXR 1.1 GPU: RTX 20 / RDNA2 or newer).
# Optional and off by default. Also in F1 > Video (applies at the next start).
# RT_AO = 1
# RT_AO_QUALITY: 0 low, 1 medium (default), 2 high.
# RT_AO_QUALITY = 1

# RSX_SSR: 1 = screen-space reflections. Off by default (costs a lot at 4K).
# RSX_SSR = 1

# ---- Audio ------------------------------------------------------------------
# AUDIO_FOLLOW_DEFAULT: 1 = the audio follows Windows' default output device when it changes.
# AUDIO_FOLLOW_DEFAULT = 1
# AUDIO_LATENCY_MS: extra delay (ms) the output adds as a safety margin. Lower = tighter lip-sync
# but crackle on a PC under load. AUDIO_LOWLAT = 1 would use a low-latency WASAPI stream
# (experimental; the stable default is 0).
AUDIO_LOWLAT = 0
AUDIO_LATENCY_MS = 32

# ---- Interface ----------------------------------------------------------------
# TOD_PROMPTS: button icons. auto = the controller of player 1 (the keyboard if there is no
# controller or it was used last); ps3 = the original ones; or ps4, ps5, xbox, switch, keyboard.
# TOD_PROMPTS = auto
# TOD_OVERLAY = 0 turns the F1 settings page off.

# ---- Saves -------------------------------------------------------------------
# PS3_SAVEDATA_ROOT: the folder that holds your saves. Default: gamedata\dev_hdd0\home\00000001\savedata
# next to tod.exe. One BCES00052_SAVE_<n> folder per save, the same layout RPCS3 uses (copying saves
# between the two should work, but it is not tested yet). F1 > System > "Saves folder" opens it.
# Copy or move the folders only while the game is closed.
# PS3_SAVEDATA_ROOT = D:\Games\ToD saves
# TOD_SAVE_PICKER: with several save slots, Load and Save show an on-screen list to choose the slot
# (with one slot nothing changes). 0 = no list: Load takes the newest slot. Default 1.
# TOD_SAVE_PICKER = 1

# ---- Game files ----------------------------------------------------------------
# PS3_VFS_ROOT: the folder that holds PS3_GAME (the installed disc). Default: game\disc next to tod.exe.
# To keep the game files on another drive, close the game, move the whole game\disc folder there and
# write its path here (elf\ stays next to tod.exe).
# PS3_VFS_ROOT = D:\Games\ToD\disc

# ---- Updates -------------------------------------------------------------------
# TOD_UPDATE_CHECK: at start the game asks GitHub whether a newer release of the port exists and says so
# in F1 > System > Updates (nothing is downloaded or installed). 0 = do not check. Default 1.
# TOD_UPDATE_CHECK = 0

# ---- Speed-ups (all on by default; 0 = off, only needed to rule one out when something looks wrong) ----
# TOD_COLL_HAND: hand-written version of a hot collision loop (same result, a little less CPU). Default 1.
# TOD_COLL_HAND = 1
# RSX_VCKEY_NODEF: fewer needless re-conversions of vertex data (fewer stutters in busy levels). Default 1.
# RSX_VCKEY_NODEF = 1
# RSX_TEXMASK_MEMO, RSX_FPSCAN_MEMO: remember per-draw texture and shader-program work instead of redoing it
# (about 2.5 ms less per frame in big levels). Default 1; 2 = also compare every result with the slow way (debug).
# RSX_TEXMASK_MEMO = 1
# RSX_FPSCAN_MEMO = 1

# ---- 1.2.0: performance, display and bug reports -------------------------------------
# TOD_PERF_DEFAULTS: the 1.2.0 performance defaults (multi-threaded renderer, native collision, video-memory
# savings, frame pacing...) are all on. To get the 1.1 behaviour back, set TOD_PERF_DEFAULTS=0 as an ENVIRONMENT
# variable (here in tod.ini the native collision would stay on: it starts before this file is read). Each setting
# also has its own key (RSX_LANES, RSX_RT_HEAP, RSX_PACE_VBLANK, RSX_VRAM_GOV...); 0 turns that one off.
# TOD_PCORES: on a CPU with P-cores and E-cores (Intel 12th gen and newer) the game runs on the P-cores only, which
# avoids freezes. 0 = off. Default 1. CPUs with one kind of core (AMD Ryzen, older Intel) are not affected.
# TOD_PCORES = 1
# TOD_SHADER_PREWARM: 0 = do not build the shipped map of graphics pipelines before the game starts (the first start,
# or the first start after a driver update, takes about 25 s with a progress window; this skips it and shaders are
# built when an effect first appears). Default: build them.
# TOD_SHADER_PREWARM = 0
# RSX_CROP_BARS: the game draws its picture 704 lines high inside a 720-line frame, which leaves thin black bars at
# the top and bottom (the PS3 shows them too). 8 cuts them and stretches the picture 2.3% taller. Default 0 (off).
# RSX_CROP_BARS = 8
# TOD_LOG_V2: 0 = do not write log\tod_v2_<date>.jsonl, the detailed log (fps, CPU, GPU, video memory, level, the cause of
# every stutter). F7 puts a mark in it. Default 1. Please attach it to bug reports.
# TOD_LOG_V2 = 1
# TOD_MINIDUMP: 1 = a crash also writes a minidump next to log\tod_crash.txt. Default 0.
# TOD_MINIDUMP = 0
# TOD_TELEPORT (EXPERIMENTAL, for testing): 1 = F5 opens a menu to teleport between levels, keeping your inventory. Default 0.
# TOD_TELEPORT = 0

# ---- Mods -------------------------------------------------------------------------
# TOD_MODS: 1 = a file in mods\ (next to tod.exe) is read instead of the game file at the same path under game\disc\; 0 = off. Default 1.
TOD_MODS = 1

# ---- Startup ------------------------------------------------------------------
# Argument for the game itself. -no_legal skips the publisher logos (remove the line to see them).
# (A value ends at a ';' or '#', so only one argument fits here.)
PS3_ARGV = -no_legal
